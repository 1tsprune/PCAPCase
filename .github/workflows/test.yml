name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install TShark on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Install TShark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wireshark -y --no-progress
          echo "C:\Program Files\Wireshark" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Check local dependencies
        run: pcapcase doctor

      - name: Run tests
        run: python -m pytest tests
